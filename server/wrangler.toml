# ChainPilot license server (Cloudflare Worker). Setup: docs/SELLER-GUIDE.md.
# Deploy from the project root:  npx wrangler deploy --config server/wrangler.toml
name = "chainpilot-api"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Production: https://proxy.momoapi.mtn.com (or https://momoapi.momo.africa once MTN has moved you)
# Sandbox:    https://sandbox.momodeveloper.mtn.com  with MOMO_TARGET_ENV = "sandbox", MOMO_CURRENCY = "EUR"
MOMO_BASE_URL = "https://proxy.momoapi.mtn.com"
MOMO_TARGET_ENV = "mtnswaziland"
MOMO_CURRENCY = "SZL"
# Extra website origins allowed to call the API, comma-separated (siteUrl from product.config.json is always allowed)
ALLOWED_ORIGINS = ""

# Orders and issued licenses. Create with:  npx wrangler kv namespace create DB --config server/wrangler.toml
[[kv_namespaces]]
binding = "DB"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# At most 5 new orders per minute from one IP address.
[[ratelimits]]
name = "ORDER_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# Secrets - set each with:  npx wrangler secret put <NAME> --config server/wrangler.toml
#   MOMO_SUBSCRIPTION_KEY   Collections product key (Ocp-Apim-Subscription-Key)
#   MOMO_API_USER           API user (or "User ID" on MTN's new platform)
#   MOMO_API_KEY            API key (or "Credential Token" on MTN's new platform)
#   LICENSE_PRIVATE_KEY     npm run -s keys -- --worker-secret | npx wrangler secret put LICENSE_PRIVATE_KEY --config server/wrangler.toml
#   ADMIN_TOKEN             any long random string, for the support endpoints
